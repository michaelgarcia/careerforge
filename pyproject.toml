[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "careerforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-docx>=1.0",
    "markdown>=3.5",
    "xhtml2pdf>=0.2.16",
    "docx2pdf>=0.1.8",
    "pywin32>=311; sys_platform == \"win32\"",
]

[tool.setuptools.packages.find]
where = ["tools"]

# Allows `python -m scripts.linkedin.sync` style invocations from project root.
# Scripts add `tools/` to sys.path explicitly — no install required.
