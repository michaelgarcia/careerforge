# Job Search Preferences
# Edit this file to define your hard constraints and soft preferences.
# The lead-gen agent reads this to filter and score postings.
# The resume and cover letter agents use soft preferences for emphasis.

# ============================================================
# HARD CONSTRAINTS — postings that violate these are filtered out
# ============================================================
hard_constraints:

  # Location preferences
  location:
    # Set to true if you only want remote roles
    remote_only: false
    # Acceptable locations (ignored if remote_only is true)
    acceptable_locations:
      - "Remote"
      # - "San Francisco, CA"
      # - "New York, NY"
      # - "Seattle, WA"
    # Set to true to include hybrid roles in acceptable locations
    include_hybrid: true

  # Compensation floor (set to 0 to disable)
  minimum_compensation_usd: 0

  # Visa/work authorization requirements
  requires_sponsorship: false

  # Custom dealbreakers (free-form list, lead-gen agent interprets these)
  dealbreakers: []
    # - "No defense/weapons industry"
    # - "No crypto/web3"
    # - "No early-stage startups (< 20 employees)"

# ============================================================
# SOFT PREFERENCES — these improve fit score but don't filter
# ============================================================
soft_preferences:

  # Preferred industries/domains (in priority order)
  preferred_domains: []
    # - "AI/ML"
    # - "Cloud Infrastructure"
    # - "FinTech"
    # - "HealthTech"

  # Preferred company stages
  preferred_company_stage: []
    # - "Growth (50-500 employees)"
    # - "Scale-up (500-5000)"
    # - "Enterprise (5000+)"

  # Preferred tech stacks or tools
  preferred_tech: []
    # - "Python"
    # - "Kubernetes"
    # - "PyTorch"
    # - "AWS"

  # Work style preferences
  work_style: []
    # - "Collaborative team environment"
    # - "High autonomy"
    # - "Strong engineering culture"
    # - "Mentorship opportunities"

  # What you're optimizing for in your next role
  career_goals: []
    # - "Technical depth over breadth"
    # - "Path to Staff+ engineering"
    # - "More leadership responsibility"
    # - "Work on cutting-edge technology"
    # - "Work-life balance"
    # - "High compensation"

# ============================================================
# SEARCH KEYWORDS — used by lead-gen agent when searching for postings
# ============================================================
search_config:
  # Job titles to search for
  target_titles: []
    # - "Senior Software Engineer"
    # - "Staff Engineer"
    # - "ML Engineer"
    # - "Engineering Manager"

  # Keywords to include in searches
  keywords: []
    # - "machine learning"
    # - "distributed systems"
    # - "platform engineering"

  # Companies of interest (optional — for targeted searches)
  target_companies: []
    # - "Company A"
    # - "Company B"

# ============================================================
# LINKEDIN SCANNER — settings for automated job discovery
# ============================================================
linkedin_scanner:
  # Role types to target. Maps to LinkedIn experience_level filters.
  # Must use exact strings from this list:
  #   "Individual Contributor"  → mid-senior
  #   "Technical Lead"          → mid-senior, director
  #   "Staff Architect"         → mid-senior, director
  #   "Principal Architect"     → director
  #   "Director"                → director
  #   "VP"                      → executive
  #   "C-Level"                 → executive
  role_types:
    - "Individual Contributor"
    # - "Technical Lead"
    # - "Staff Architect"
    # - "Principal Architect"
    # - "Director"
    # - "VP"
    # - "C-Level"

  # Minimum score (0-100) to surface a job in the daily report
  lead_score_threshold: 65
  # Maximum jobs to LLM-score per scan run (controls cost)
  max_score_per_run: 30
  # Number of days back to include unscored jobs in export
  export_lookback_days: 7
