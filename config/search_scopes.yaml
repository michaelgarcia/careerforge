# Named search scopes for LinkedIn job discovery.
# Add/disable scopes here to tune coverage. Run a single scope with:
#   python scripts/linkedin/sync.py --scope <name> --dry-run
#
# Field reference:
#   name            - Unique identifier used in CLI --scope flag and DB records
#   description     - Human-readable summary of what this scope targets
#   keywords        - Free-text LinkedIn search string
#   locations       - List of location strings (e.g. "Remote", "Chicago, IL")
#   experience_levels - LinkedIn levels: internship, entry-level, associate,
#                       mid-senior, director, executive
#   work_model      - remote | hybrid | on-site (omit for any)
#   date_posted     - past-24h | past-week | past-month | any-time
#   limit           - Max jobs to collect per run (LinkedIn pages of 25)
#   enabled         - Set to false to skip without deleting the config

scopes:
  - name: gtm_sa_ai_cloud
    description: "Solutions Architect roles in AI and Cloud go-to-market (pre-sales); targets Anthropic, Databricks, OpenAI, Google, Microsoft and the broader AI-native market"
    keywords: "Solutions Architect AI Cloud Generative GTM Pre-Sales"
    locations:
      - "Remote"
      - "Chicago, IL"
    experience_levels:
      - mid-senior
      - director
    date_posted: past-week
    limit: 75
    enabled: true

  - name: forward_deploy_engineer
    description: "Forward Deploy Engineer and Delivery Solutions Architect roles; post-sales, customer implementation-focused"
    keywords: "Forward Deploy Engineer Delivery Solutions Architect Implementation Customer"
    locations:
      - "Remote"
      - "Chicago, IL"
    experience_levels:
      - mid-senior
      - director
    date_posted: past-week
    limit: 75
    enabled: true

  - name: field_cto_industrial_tech
    description: "Field CTO roles at industrial tech, AI data platform, manufacturing tech, or IoT vendors; leverages automotive and cloud domain expertise"
    keywords: "Field CTO Technology Vendor Industrial Manufacturing Automotive Cloud"
    locations:
      - "Remote"
      - "Chicago, IL"
    experience_levels:
      - mid-senior
      - director
    date_posted: past-week
    limit: 75
    enabled: true

  - name: physical_ai_robotics_architect
    description: "Principal Architect or Staff Architect for AI solutions in robotics and physical AI; manufacturing and automotive background is a differentiator"
    keywords: "Principal Architect Staff Architect AI Robotics Physical Manufacturing Autonomous"
    locations:
      - "Remote"
      - "Chicago, IL"
    experience_levels:
      - mid-senior
      - director
    date_posted: past-week
    limit: 75
    enabled: true

  - name: director_ai_product_roles
    description: "Director of Product, Director AI Solutions, Principal PM, and Head of AI roles in AI and cloud technology companies"
    keywords: "Director Product AI Technology Cloud Principal Program Manager Head"
    locations:
      - "Remote"
      - "Chicago, IL"
    experience_levels:
      - mid-senior
      - director
    date_posted: past-week
    limit: 75
    enabled: true
